name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TransportManager_Fixed_Project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: java
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Build APK
        env:
          JAVA_HOME: ${{ steps.java.outputs.path }}
        run: |
          ls -la
          cat build.gradle settings.gradle
          gradle assembleDebug --no-daemon --stacktrace -Dorg.gradle.java.home="${{ steps.java.outputs.path }}"
      - uses: actions/upload-artifact@v4
        with:
          name: TransportManager-APK
          path: TransportManager_Fixed_Project/app/build/outputs/apk/debug/app-debug.apk
